license = "MIT"

modLoader="javafml"
loaderVersion="[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "PotatoY"
description = "Sends server messages to a Discord webhook."

logoFile = "assets/mcdiscordwebhook/icon.png"
displayURL = "https://github.com/jae1u/mc-discord-webhook"
#issueTrackerUrl = "..."

[[mixins]]
config = "mcdiscordwebhook.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"