license = "MIT"

modLoader="javafml"
loaderVersion="[47,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "PotatoY"
description = "Sends server messages to a Discord webhook."

logoFile = "assets/mcdiscordwebhook/icon.png"
displayURL = "https://github.com/jae1u/mc-discord-webhook"
#issueTrackerUrl = "..."
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"